<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
max-width:400px;
margin:auto;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
color:#2563eb;
}
</style>

</head>

<body>

<div class="box">

<h2>My Account</h2>

<h3 id="name">Student Name</h3>

<p id="email">student@email.com</p>

</div>

<script>

document.getElementById("name").innerHTML =
localStorage.getItem("studentName");

document.getElementById("email").innerHTML =
localStorage.getItem("studentEmail");

</script>

</body>
</html>
